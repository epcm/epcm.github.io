        summary: Advised by Prof. Abeer Alwan and Prof. Yuan Tian.
        highlights:
          - "**Speech tokenization and representation learning.** Developed STACodec, a discrete speech tokenizer that directly assigns SSL-derived semantic tokens to the first RVQ layer, jointly preserving acoustic fidelity and semantic information for unified speech understanding and generation, with a Semantic Pre-Distillation module to reduce inference cost (ICASSP 2026). Systematically evaluated supervised and unsupervised semantic tokenization for low-resource ASR (AI4CSL Workshop @ ASRU 2025, Best Paper Award)."
          - "**Speech foundation model post-training.** Developed a domain-routed Mixture-of-Experts Speech-LLM for multi-domain ASR, reducing child-speech WER by up to 19% relative while preserving adult-speech accuracy (Interspeech 2026, Best Student Paper Nominee). Developed acoustics-aware LoRA adapters with local convolutional modeling (Interspeech 2026), an encoder-awakening strategy for domain adaptation of Speech-LLMs (SLT 2026), a self-supervised domain adaptation method with learnable Gumbel-Softmax layer selection (Interspeech 2026), and a two-stage fine-tuning approach for joint child–adult role diarization and ASR (under review, ICASSP 2027)."
          - "**LLM applications.** Released CHSER, a 200K-pair dataset for training LLMs to correct child ASR errors, with consistent WER reductions across domains and architectures (Interspeech 2025). Built a pipeline combining ASR with an LLM-as-a-Judge for automated scoring and feedback in children's spoken language assessment (SLaTE 2025)."
          - "**AI safety, security and privacy.** Proposed the first black-box membership inference attack on fine-tuned TTS models at both speaker and record levels, demonstrating training-data leakage across three widely used TTS models (under review, NDSS 2027). Mitigated hallucinations in speech foundation models via uncertainty-routed activation editing at inference time (SLT 2026)."

